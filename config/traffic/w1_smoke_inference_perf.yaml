# W1 smoke for inference-perf 0.6.1 in bare-metal mode: 20 s of Poisson traffic at 1 rps against
# the local vLLM server. Purpose is only to prove the tool runs here and emits the metrics the
# harness needs (TTFT / TPOT / ITL / goodput); nothing in this file is a measurement setting.
api:
  type: chat
  streaming: true
data:
  type: synthetic
  input_distribution: { min: 64, max: 256, mean: 108, std_dev: 40, total_count: 200 }
  output_distribution: { min: 32, max: 256, mean: 132, std_dev: 40, total_count: 200 }
load:
  type: poisson
  interval: 1.0
  stages:
    - rate: 1
      duration: 20
  num_workers: 2
  worker_max_concurrency: 50
  request_timeout: 60
server:
  type: vllm
  model_name: Qwen/Qwen3-8B-FP8
  base_url: http://127.0.0.1:8013
  ignore_eos: true
tokenizer:
  pretrained_model_name_or_path: Qwen/Qwen3-8B-FP8
report:
  request_lifecycle:
    summary: true
    per_stage: true
    per_request: true
  goodput:
    constraints: { ttft: 1.0, tpot: 0.05 }   # seconds (reportgen compares against *_slo_sec)
storage:
  local_storage:
    path: reports/w1-smoke   # relative to the working directory the tool is launched from
