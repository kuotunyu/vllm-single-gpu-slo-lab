# config/cost.yaml — OWNER INPUT (design spec §6). Committed so `make reproduce` can run.
#
# EVERY NUMBER BELOW IS A PLACEHOLDER. Nothing derived from this file may be published while
# `status` is `owner_input_pending`; `slo-lab cost` prints a caveat until the owner replaces the
# values, cites the sources, and flips `status` to `owner_provided`.
#
# ADR 0010 (2026-09-11, owner decision): the RTX 4090 is owned hardware, so no $ per million
# tokens is computed for it and these placeholders stay unfilled; the cost axis reports measured
# GPU-board energy (Wh per million output tokens) instead. The file remains for a rented GPU
# (A1), whose hourly price is an observation rather than an assumption.
status: owner_input_pending

gpu_purchase_price_twd: 60000        # OWNER INPUT placeholder: actual RTX 4090 price paid, TWD
purchase_date: "2024-01-01"          # OWNER INPUT placeholder: receipt date (YYYY-MM-DD)
amortisation_years: 3                # proposal; sensitivity reported in analysis
duty_hours_per_day: 24               # proposal default 24; an 8 h/day sensitivity is always reported
electricity_twd_per_kwh: 4.0         # OWNER INPUT placeholder: Taipower tier actually billed
electricity_source: "OWNER INPUT: Taipower tariff tier, URL and date"
twd_per_usd: 32.0                    # OWNER INPUT placeholder: FX rate used for the report
fx_source: "OWNER INPUT: FX source and date"
input_output_price_ratio: null       # optional; enables the Google blended $/output-token column
