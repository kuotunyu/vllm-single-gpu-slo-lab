[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vllm-single-gpu-slo-lab"
version = "0.0.1"
description = "SLO-constrained capacity, admission-control and cost lab for vLLM on a single GPU (W0 skeleton, no results yet)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "kuotunyu" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: System :: Benchmark",
]
# Runtime deps are deliberately minimal and CPU-only. vLLM and torch are NOT project
# dependencies: the design spec runs vLLM from a separate WSL2 environment (see README,
# "環境"), and `make reproduce` must work on a CPU-only CI runner with no GPU and no network.
dependencies = [
  "numpy>=1.26,<3",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
  # HTTP stack for the admission shim (policies (ii) cap+429 and (iii) bounded queue).
  # aiohttp was chosen over starlette+uvicorn+httpx because ONE dependency provides both
  # the asyncio HTTP server and the streaming upstream client, it relays SSE/chunked bodies
  # without buffering, and aiohttp.test_utils gives an in-process loopback test server so
  # the unit tests need no network. The ASGI alternative needs three packages for the same
  # reverse-proxy job and adds a middleware layer whose latency the W1 pass-through
  # overhead measurement (spec §3.5) would then have to explain away.
  "aiohttp>=3.10,<4",
]

[project.urls]
Homepage = "https://github.com/kuotunyu/vllm-single-gpu-slo-lab"
Repository = "https://github.com/kuotunyu/vllm-single-gpu-slo-lab"

[project.optional-dependencies]
# NVML bindings (import name `pynvml`). Only the WSL2 measurement host needs this;
# every module imports it lazily and degrades to a clear error when it is absent.
gpu = ["nvidia-ml-py>=12"]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
slo-lab = "slo_lab.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/slo_lab"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks", "eval/tmmluplus/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
